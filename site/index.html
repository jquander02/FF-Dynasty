<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dynasty Analyzer</title>
  <meta name="description" content="Year-round analysis for a Sleeper dynasty league">
  <meta name="theme-color" content="#0d1410" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#edf1ec" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dynasty">
  <link rel="preload" href="fonts/BigShouldersDisplay.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="top">
    <div class="brand">
      <h1 id="league-name">Dynasty</h1>
      <p id="league-sub" class="sub">Loading your league…</p>
    </div>
    <button id="lockbtn" class="icon-btn lock-btn" type="button" aria-label="Lock this device" title="Lock this device">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z"/></svg>
    </button>
    <button id="refresh" class="icon-btn" type="button" aria-label="Reload data">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
    </button>
    <nav class="tabs" aria-label="Sections">
      <a href="#league" data-tab="league">League</a>
      <a href="#week" data-tab="week" data-private>Week</a>
      <a href="#team" data-tab="team" data-private>Team</a>
      <a href="#values" data-tab="values" data-private>Values</a>
      <a href="#picks" data-tab="picks" data-private>Picks</a>
      <a href="#plan" data-tab="plan" data-private>Plan</a>
      <a href="#trade" data-tab="trade" data-private>Trade</a>
      <a href="#trades" data-tab="trades">Past trades</a>
      <a href="#owners" data-tab="owners" data-private>Managers</a>
      <a href="#activity" data-tab="activity" data-private>Moves</a>
    </nav>
  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#league" data-tab="league">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>League</a>
    <a href="#week" data-tab="week" data-private>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v14H5zM5 10h14M9 3v5M15 3v5"/></svg>Week</a>
    <a href="#team" data-tab="team" data-private>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l7 3v5c0 4-3 7-7 8-4-1-7-4-7-8V7z"/></svg>Team</a>
    <a href="#values" data-tab="values" data-private>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>Values</a>
    <a href="#picks" data-tab="picks" data-private>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 9-8 9-8-9z"/></svg>Picks</a>
    <a href="#plan" data-tab="plan" data-private>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>Plan</a>
    <a href="#trade" data-tab="trade" data-private>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>Trade</a>
    <a href="#trades" data-tab="trades" data-lockedonly>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>Past trades</a>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close="1"></div>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></section>
  </div>

  <script src="app.js"></script>
</body>
</html>
