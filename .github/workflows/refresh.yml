name: Refresh and deploy

on:
  schedule:
    # Full refresh once a day, 3:17am Central standard time (09:17 UTC): stats, players, owners' other leagues.
    - cron: "17 9 * * *"
    # Quick league-only refreshes while games are on (times in UTC): every 2 hours Sat-Mon
    # (Saturday and Sunday games, Monday's late window), the early hours of Tue and Fri (Monday
    # and Thursday night games), and Thursday evening before kickoff (injury news).
    - cron: "7 */2 * * 0,1,6"
    - cron: "7 0-4/2 * * 2,5"
    - cron: "7 22 * * 4"
  workflow_dispatch:
    inputs:
      mode:
        description: "full or quick"
        default: full
        type: choice
        options: [full, quick]
  push:
    branches: [main]
    paths: ["site/**", "dynasty/**", "config.yaml", "requirements*"]

concurrency:
  group: refresh
  cancel-in-progress: false

# Nothing by default; each job asks for only what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read      # find the newest database backup if the cache is ever lost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip

      # requirements.lock pins exact versions with hashes (made by the "Lock dependencies" workflow)
      - name: Install
        run: |
          if [ -f requirements.lock ]; then
            pip install --require-hashes -r requirements.lock
          else
            pip install -r requirements.txt
          fi

      - name: Run tests
        run: python -m unittest discover -s tests

      # The database lives in the Actions cache between runs. It holds history that can't be
      # downloaded again (daily values, rosters over time), so if the cache is ever lost the newest
      # backup artifact is restored instead of starting over.
      - name: Restore database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: data
          key: dbz-${{ github.run_id }}
          restore-keys: dbz-

      - name: Restore from backup if the cache is gone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/dynasty.db.gz ] || [ -f data/dynasty.db ]; then exit 0; fi
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
                 -q '[.artifacts[] | select((.name=="dynasty-db" or .name=="dynasty-db-weekly") and .expired==false)]
                     | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then
            echo "::warning::No database cache and no backup: this run starts from scratch"
            exit 0
          fi
          mkdir -p data
          gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > db.zip
          unzip -o db.zip -d data
          rm db.zip
          echo "::notice::Database restored from backup artifact $id"

      - name: Unpack database
        run: |
          if [ -f data/dynasty.db.gz ]; then gunzip -f data/dynasty.db.gz; fi
          ls -la data 2>/dev/null || echo "No database: this run starts fresh"

      - name: Refresh data
        run: |
          MODE=full
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "17 9 * * *" ]; then MODE=quick; fi
          if [ "${{ github.event.inputs.mode }}" = "quick" ]; then MODE=quick; fi
          # A push only redeploys the app; quick-refresh so the data stays current.
          if [ "${{ github.event_name }}" = "push" ]; then MODE=quick; fi
          echo "Mode: $MODE"
          set -o pipefail
          if [ "$MODE" = "quick" ]; then
            python -m dynasty refresh --quick -v 2>&1 | tee refresh.log
          else
            python -m dynasty refresh -v 2>&1 | tee refresh.log
          fi
          python -m dynasty status | tee -a refresh.log

      # Summaries as annotations, readable on the run page and through the API.
      - name: Report
        if: always()
        run: |
          [ -f refresh.log ] || exit 0
          enc() { python3 -c 'import sys; s=sys.stdin.read()[-60000:]; print(s.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          msg=$(grep -v -E " (INFO|DEBUG|WARNING) " refresh.log | enc)
          echo "::notice title=Refresh summary::$msg"
          if grep -q " WARNING " refresh.log; then
            msg=$(grep " WARNING " refresh.log | enc)
            echo "::warning title=Refresh warnings::$msg"
          fi
          if grep -q -E "Traceback|Error:" refresh.log; then
            msg=$(tail -n 60 refresh.log | enc)
            echo "::error title=Refresh error::$msg"
          fi

      # Scores the projection model against past seasons; never blocks the deploy.
      - name: Backtest
        if: success()
        continue-on-error: true
        run: |
          python -m dynasty.backtest bundle data/dynasty.db backtest-bundle.json.gz
          python -m dynasty.backtest run backtest-bundle.json.gz --json backtest-report.json | tee backtest.log
          # Sleeper's past weekly projections (for testing projection blends): fetched once, then kept
          # on the site-data branch and carried forward
          git fetch -q --depth 1 "https://github.com/${{ github.repository }}.git" site-data 2>/dev/null \
            && git show FETCH_HEAD:backtest/sleeper-proj-history.json.gz > sleeper-proj-history.json.gz 2>/dev/null \
            || rm -f sleeper-proj-history.json.gz
          if [ ! -s sleeper-proj-history.json.gz ]; then
            python -m dynasty.backtest sleeper-history data/dynasty.db sleeper-proj-history.json.gz | tee -a backtest.log || true
          fi
          msg=$(python3 -c 'import sys; s=open("backtest.log").read(); print(s.replace("%","%25").replace("\n","%0A"))')
          echo "::notice title=Backtest::$msg"

      # Compressed (SQLite shrinks ~4x) so the cache stays small and reliable. The write-ahead log
      # is folded into the database first, so nothing in it is lost.
      - name: Pack database
        if: success()
        run: |
          python3 -c "import sqlite3; c=sqlite3.connect('data/dynasty.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          rm -f data/dynasty.db-wal data/dynasty.db-shm
          gzip -f data/dynasty.db
          ls -la data

      - name: Save database
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: data
          key: dbz-${{ github.run_id }}

      # Backups for when the cache is lost: one a day kept 7 days, and Sunday's kept 90 days.
      - name: Back up database
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dynasty-db
          path: data/dynasty.db.gz
          retention-days: 7

      - name: Check for the weekly backup
        id: weekly
        run: echo "sunday=$([ "$(date -u +%u)" = 7 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Back up database (weekly, 90 days)
        if: success() && steps.weekly.outputs.sunday == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dynasty-db-weekly
          path: data/dynasty.db.gz
          retention-days: 90
          overwrite: true

      - name: Collect data snapshot
        if: success()
        run: |
          mkdir -p snapshot/backtest
          cp -r site/data/. snapshot/
          cp backtest-bundle.json.gz backtest-report.json sleeper-proj-history.json.gz snapshot/backtest/ 2>/dev/null || true

      - name: Upload data snapshot
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: site-data
          path: snapshot
          retention-days: 1

      - name: Upload app
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: site

  # A single-commit branch with the exported JSON, for debugging and previews. Never blocks the deploy.
  snapshot:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: site-data
          path: snapshot
      - name: Snapshot data to site-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd snapshot
          git init -q -b site-data
          git add .
          git -c user.name="refresh-bot" -c user.email="refresh-bot@users.noreply.github.com" commit -qm "Data snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" site-data

  # Publishes site/ (app + freshly exported data) to GitHub Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6

      # GitHub sometimes can't see the just-uploaded app for a few seconds ("No artifacts named
      # github-pages were found"), or rejects a deploy ("try again later"): wait and retry twice.
      - name: Deploy to GitHub Pages
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5

      - name: Wait before retrying deploy
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5

      - name: Wait before last deploy attempt
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 180

      - name: Deploy to GitHub Pages (last try)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
