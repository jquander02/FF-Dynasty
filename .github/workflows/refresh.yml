name: Refresh and deploy

on:
  schedule:
    # Full refresh once a day, 4:17am Central (09:17 UTC): stats, players, owners' other leagues.
    - cron: "17 9 * * *"
    # Quick league-only refresh every 2 hours on game days (Sun, Mon, Thu in UTC).
    - cron: "7 */2 * * 0,1,4"
  workflow_dispatch:
    inputs:
      mode:
        description: "full or quick"
        default: full
        type: choice
        options: [full, quick]
  push:
    branches: [main]
    paths: ["site/**", "dynasty/**", "config.yaml"]

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write   # for the site-data snapshot branch
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      # The database lives in the Actions cache between runs. If it is ever lost,
      # the next full run rebuilds it from scratch (all data is re-downloadable).
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data
          key: dbz-${{ github.run_id }}
          restore-keys: dbz-

      - name: Unpack database
        run: |
          if [ -f data/dynasty.db.gz ]; then gunzip -f data/dynasty.db.gz; fi
          ls -la data 2>/dev/null || echo "No cached database: this run starts fresh"

      - name: Refresh data
        env:
          # PIN that unlocks everything but League and Past trades (repo secret DYNASTY_PIN)
          DYNASTY_PIN: ${{ secrets.DYNASTY_PIN }}
        run: |
          MODE=full
          if [ "${{ github.event.schedule }}" = "7 */2 * * 0,1,4" ]; then MODE=quick; fi
          if [ "${{ github.event.inputs.mode }}" = "quick" ]; then MODE=quick; fi
          # A push only redeploys the app; quick-refresh so the data stays current.
          if [ "${{ github.event_name }}" = "push" ]; then MODE=quick; fi
          echo "Mode: $MODE"
          set -o pipefail
          if [ "$MODE" = "quick" ]; then
            python -m dynasty refresh --quick -v 2>&1 | tee refresh.log
          else
            python -m dynasty refresh -v 2>&1 | tee refresh.log
          fi
          python -m dynasty status | tee -a refresh.log

      # Summaries as annotations, readable on the run page and through the API.
      - name: Report
        if: always()
        run: |
          [ -f refresh.log ] || exit 0
          enc() { python3 -c 'import sys; s=sys.stdin.read()[-60000:]; print(s.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          msg=$(grep -v -E " (INFO|DEBUG|WARNING) " refresh.log | enc)
          echo "::notice title=Refresh summary::$msg"
          if grep -q " WARNING " refresh.log; then
            msg=$(grep " WARNING " refresh.log | enc)
            echo "::warning title=Refresh warnings::$msg"
          fi
          if grep -q -E "Traceback|Error:" refresh.log; then
            msg=$(tail -n 60 refresh.log | enc)
            echo "::error title=Refresh error::$msg"
          fi

      # Scores the projection model against past seasons; never blocks the deploy.
      - name: Backtest
        if: success()
        continue-on-error: true
        run: |
          python -m dynasty.backtest bundle data/dynasty.db backtest-bundle.json.gz
          python -m dynasty.backtest run backtest-bundle.json.gz --json backtest-report.json | tee backtest.log
          msg=$(python3 -c 'import sys; s=open("backtest.log").read(); print(s.replace("%","%25").replace("\n","%0A"))')
          echo "::notice title=Backtest::$msg"

      # Compressed (SQLite shrinks ~4x) so the cache stays small and reliable.
      - name: Pack database
        if: success()
        run: |
          rm -f data/dynasty.db-wal data/dynasty.db-shm
          gzip -f data/dynasty.db
          ls -la data

      - name: Save database
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data
          key: dbz-${{ github.run_id }}

      # The repo is public, so anyone signed in to GitHub can download run artifacts: the backup is
      # encrypted with the PIN (decrypt: DYNASTY_PIN=... python -m dynasty.vault decrypt-file IN OUT).
      # No PIN, no backup (the Actions cache above still holds the database).
      - name: Encrypt database backup
        if: success()
        env:
          DYNASTY_PIN: ${{ secrets.DYNASTY_PIN }}
        run: |
          if [ -n "$DYNASTY_PIN" ]; then
            mkdir -p backup
            python -m dynasty.vault encrypt-file data/dynasty.db.gz backup/dynasty.db.gz.enc
          fi

      - name: Back up database
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dynasty-db-encrypted
          path: backup/dynasty.db.gz.enc
          retention-days: 7
          if-no-files-found: ignore

      # A single-commit branch with the exported JSON, for debugging and previews.
      - name: Snapshot data to site-data branch
        if: success()
        run: |
          cd site/data
          mkdir -p backtest
          cp ../../backtest-bundle.json.gz ../../backtest-report.json backtest/ 2>/dev/null || true
          git init -q -b site-data
          git add .
          git -c user.name="refresh-bot" -c user.email="refresh-bot@users.noreply.github.com" commit -qm "Data snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site-data
          rm -rf .git backtest

      # Publishes site/ (app + freshly exported data) to GitHub Pages.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload app
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
