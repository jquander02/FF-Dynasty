name: Lock dependencies

# Run by hand after changing requirements.txt: compiles a hash-pinned requirements.lock, checks
# the tests pass with it, and commits it, so the refresh installs exactly those packages.
on:
  workflow_dispatch:

permissions:
  contents: write   # to commit requirements.lock

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Compile the lock file
        run: |
          pip install pip-tools
          pip-compile --generate-hashes --allow-unsafe --strip-extras -q -o requirements.lock requirements.txt
          pip install --require-hashes -r requirements.lock
          python -m unittest discover -s tests
      - name: Commit the lock file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add requirements.lock
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git -c user.name="refresh-bot" -c user.email="refresh-bot@users.noreply.github.com" commit -qm "Lock dependencies"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
