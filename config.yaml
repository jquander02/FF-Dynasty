# Your Sleeper league and username. Not secret: Sleeper league data is public.
league_id: "1312163152787443712"
username: jquander

# Past NFL seasons of nflverse stats to keep (the current season is always included).
# 12 gives the age curves more data and the backtest (dynasty/backtest.py) seasons to score.
nfl_seasons_back: 12

# Pull every league-mate's other Sleeper leagues and drafts (for owner tendencies).
owner_leagues: true

# Optional nflverse datasets: nextgen, pfr_advstats, injuries, depth_charts (very large).
nflverse_extras: [nextgen, pfr_advstats, injuries]

# Dynasty value blend (phase 2): leans on the projection model, uses market values too.
value_weights: {model: 0.6, fantasycalc: 0.3, dynastyprocess: 0.1}
